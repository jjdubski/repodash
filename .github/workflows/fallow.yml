name: Fallow analysis

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  fallow:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'opened' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || '' }}
          fetch-depth: 0
      - name: Resolve PR number
        id: pr-number
        if: github.event_name != 'push'
        run: echo "number=${{ github.event.inputs.pr_number || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
      - name: Create pending check run
        id: create-check
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.pr-number.outputs.number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Fallow analysis',
              head_sha: pr.head.sha,
              status: 'in_progress'
            });
            core.setOutput('check-run-id', check.id);
      - name: Resolve base SHA for audit
        id: base-sha
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr-number.outputs.number }}"
          echo "sha=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.base.sha')" >> "$GITHUB_OUTPUT"
      - uses: fallow-rs/fallow@v2
        with:
          command: ${{ github.event_name != 'push' && 'audit' || '' }}
          format: sarif
          fail-on-issues: false
          changed-since: ${{ steps.base-sha.outputs.sha }}
          comment: ${{ github.event_name != 'push' }}
          review-comments: false
          annotations: ${{ github.event_name == 'push' }}
          dupes-mode: semantic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          threshold: 10
      - name: Fail on errors / high CRAP
        if: always()
        shell: bash
        run: |
          sarif_file="${FALLOW_SARIF_FILE:-fallow-results.sarif}"
          if [ ! -f "$sarif_file" ]; then
            echo "::warning::SARIF file not found, skipping error check"
            exit 0
          fi
          errors=$(jq '[.runs[0].results[] | select(.level == "error")] | length' "$sarif_file" 2>/dev/null || echo "0")
          if [ "$errors" -gt 0 ] 2>/dev/null; then
            echo "::error::Fallow found $errors error(s) (high CRAP / errors)"
            exit 1
          fi
      - name: Post fallow summary as PR comment
        if: steps.base-sha.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT=$(fallow audit --root . --changed-since "${{ steps.base-sha.outputs.sha }}" --format pr-comment-github --quiet 2>/dev/null || true)
          if [ -n "$COMMENT" ]; then
            gh pr comment "${{ steps.pr-number.outputs.number }}" --body "$COMMENT" --repo "${{ github.repository }}"
          fi
      - name: Complete check run
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const checkRunId = ${{ steps.create-check.outputs.check-run-id }};
            if (!checkRunId) {
              console.log('No pending check run found — creation may have failed.');
              return;
            }
            const status = '${{ job.status }}';
            const conclusion = status === 'success' ? 'success' : status === 'cancelled' ? 'cancelled' : 'failure';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: 'Fallow analysis',
                summary: `Analysis completed with status: ${status}`
              }
            });
