      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add node_modules/.bin to PATH for reviewdog stylelint
        run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"
