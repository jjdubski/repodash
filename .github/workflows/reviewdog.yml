              conclusion: conclusion,
              output: {
                title: `reviewdog/${tool}`,
                summary: `**${tool}** — ${summaryText}`
              }
            });

  check:
    if: github.event_name == 'push'
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: reviewdog/action-eslint@v1
        id: eslint
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          tool_name: reviewdog-eslint
          level: warning
          fail_level: error
          filter_mode: nofilter
          eslint_flags: 'src/ bin/ dashboard/ tests/'
      - uses: reviewdog/action-actionlint@v1
        id: actionlint
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          tool_name: reviewdog-actionlint
          level: warning
          fail_level: error
          filter_mode: nofilter
      - uses: reviewdog/action-markdownlint@v0
        id: markdownlint
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          fail_level: none
          filter_mode: nofilter
          markdownlint_flags: '--ignore node_modules docs .husky .'
          reviewdog_flags: '-name reviewdog-markdownlint'
      - uses: reviewdog/action-shellcheck@v1
        id: shellcheck
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          fail_level: error
          filter_mode: nofilter
          exclude: |
            */.git/*
            ./.husky/_/husky.sh
            **/node_modules/**
          reviewdog_flags: '-name reviewdog-shellcheck'
      - uses: reviewdog/action-stylelint@v1
        id: stylelint
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          fail_level: error
          filter_mode: nofilter
          name: reviewdog-stylelint
          stylelint_input: '**/*.css'
      - name: Check results
        if: always()
        env:
          ESLINT: ${{ steps.eslint.outcome }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          MARKDOWNLINT: ${{ steps.markdownlint.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          STYLELINT: ${{ steps.stylelint.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## reviewdog Linter Results

          | Linter | Status |
          |--------|--------|
          EOF

          failures=()

          add_result() {
              local name="$1"
              local status_var="$2"
              if [[ "${!status_var}" == "success" ]]; then
                  echo "| $name | Passed |" >> "$GITHUB_STEP_SUMMARY"
              elif [[ "${!status_var}" == "failure" ]]; then
                  echo "| $name | Failed |" >> "$GITHUB_STEP_SUMMARY"
                  failures+=("$name")
              elif [[ "${!status_var}" == "skipped" ]]; then
                  echo "| $name | Skipped |" >> "$GITHUB_STEP_SUMMARY"
              else
                  echo "| $name | ${!status_var} |" >> "$GITHUB_STEP_SUMMARY"
              fi
          }

          add_result ESLint ESLINT
          add_result actionlint ACTIONLINT
          add_result markdownlint MARKDOWNLINT
          add_result shellcheck SHELLCHECK
          add_result stylelint STYLELINT

          if [[ ${#failures[@]} -gt 0 ]]; then
              printf "\n**Linters with errors: %s**\n" "${failures[*]}" >> "$GITHUB_STEP_SUMMARY"
              echo "Linters with errors: ${failures[*]}"
              exit 1
          else
              printf "\n**All linters passed!**\n" >> "$GITHUB_STEP_SUMMARY"
              echo "All linters passed"
          fi
