name: reviewdog

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  eslint:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'opened' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review')
    name: runner / eslint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', github.event.inputs.pr_number) || '' }}
      - name: Resolve PR number
        id: pr-number
        if: github.event_name != 'push'
        run: echo "number=${{ github.event.inputs.pr_number || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
      - name: Create pending check run
        id: create-check-eslint
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.pr-number.outputs.number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'ESLint',
              head_sha: pr.head.sha,
              status: 'in_progress'
            });
            core.setOutput('check-run-id', check.id);
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set PR context for reviewdog
        if: github.event_name == 'issue_comment'
        run: |
          echo "GITHUB_EVENT_NAME=pull_request" >> "$GITHUB_ENV"
          echo "GITHUB_REF=refs/pull/${{ github.event.issue.number }}/merge" >> "$GITHUB_ENV"
      - uses: reviewdog/action-eslint@v1
        id: eslint
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_level: warning
          filter_mode: added
          eslint_flags: 'src/ bin/ dashboard/ tests/'
          reviewdog_flags: '-pr=${{ steps.pr-number.outputs.number }}'
        env:
          GITHUB_REF: refs/pull/${{ steps.pr-number.outputs.number }}/merge
      - name: Complete check run
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const checkRunId = ${{ steps.create-check-eslint.outputs.check-run-id }};
            if (!checkRunId) {
              console.log('No pending check run found — creation may have failed.');
              return;
            }
            const status = '${{ job.status }}';
            const tool = 'ESLint';
            const conclusion = status === 'success' ? 'success' : status === 'cancelled' ? 'cancelled' : 'failure';
            const summaryText = conclusion === 'success'
              ? 'No issues found.'
              : conclusion === 'cancelled'
                ? 'Check was cancelled.'
                : 'Issues found. Check the annotations for details.';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: `reviewdog/${tool}`,
                summary: `**${tool}** — ${summaryText}`
              }
            });

